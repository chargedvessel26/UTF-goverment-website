<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form POL-100: Incident Report - Penland Law Enforcement</title>
    <style>
      body {
        font-family: "Times New Roman", serif;
        padding: 40px;
        color: #000;
      }
      .header {
        text-align: center;
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      .header h1 {
        margin: 0;
        font-size: 22px;
        text-transform: uppercase;
      }
      .section-title {
        font-weight: bold;
        background: #eee;
        padding: 5px;
        margin-top: 20px;
        border: 1px solid #000;
        font-size: 14px;
      }
      .field-group {
        margin: 15px 0;
        display: flex;
        justify-content: space-between;
      }
      .field {
        flex: 1;
        margin-right: 15px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .field-line {
        border-bottom: 1px solid #000;
        height: 25px;
      }
      .print-btn {
        background: #002868;
        color: white;
        padding: 10px 20px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 20px;
      }
      @media print {
        .print-btn {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="window.print()">
      🖨️ Print or Save as PDF
    </button>
    <div class="header">
      <h1>Republic of Penland</h1>
      <p>National Police Force — Law Enforcement Division</p>
      <h2>FORM POL-100: OFFICIAL INCIDENT REPORT</h2>
      <p>Under Book I, Section 5 of the Penal Code[cite: 1]</p>
    </div>
    <div class="section-title">SECTION 1: COMPLAINANT / REPORTING PARTY</div>
    <div class="field-group">
      <div class="field">
        <label>Full Name:</label>
        <div class="field-line"></div>
      </div>
      <div class="field">
        <label>Contact Phone Number:</label>
        <div class="field-line"></div>
      </div>
    </div>
    <div class="section-title">SECTION 2: INCIDENT DETAILS</div>
    <div class="field-group">
      <div class="field">
        <label>Date & Time of Incident:</label>
        <div class="field-line"></div>
      </div>
      <div class="field">
        <label>Location of Incident:</label>
        <div class="field-line"></div>
      </div>
    </div>
    <div class="field-group">
      <div class="field">
        <label>Description of Incident / Property Stolen:</label>
        <div class="field-line" style="height: 60px"></div>
      </div>
    </div>
    <div class="section-title">SECTION 3: VERIFICATION</div>
    <div class="field-group" style="margin-top: 40px">
      <div class="field">
        <label>Reporting Party Signature:</label>
        <div class="field-line"></div>
      </div>
      <div class="field">
        <label>Date Submitted:</label>
        <div class="field-line"></div>
      </div>
    </div>
  </body>
</html>
